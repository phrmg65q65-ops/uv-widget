name: UV-Prognose

# Täglich: ICON-CH2 (00 UTC) + CAMS (Vortag 12 UTC) → icon-uv → docs/*.json
on:
  schedule:
    - cron: "45 4 * * *"
    - cron: "45 6 * * *"
  workflow_dispatch:
    inputs:
      ensemble:
        description: "Volles ICON-CH2-EPS (21 Member, dauert deutlich länger)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: uv-forecast
  cancel-in-progress: false

env:
  ICON_UV_REF: 50452d9b5f9b0890fa11418338c6dd5b79ca03a3
  DAYS: "4"
  EARLY_CRON: "45 4 * * *"

jobs:
  forecast:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Zyklen bestimmen
        id: cycle
        env:
          EVENT: ${{ github.event_name }}
        run: |
          today=$(date -u +%Y-%m-%d)
          echo "icon=${today}T00:00:00Z" >> "$GITHUB_OUTPUT"
          echo "cams=$(date -u -d yesterday +%Y-%m-%d)T12:00:00Z" >> "$GITHUB_OUTPUT"
          echo "issued=$(date -u +%Y-%m-%dT%H:%M:00Z)" >> "$GITHUB_OUTPUT"
          current=$(python3 -c "import json;print(json.load(open('docs/daily-uv.json'))['sources']['icon']['reference_time'][:10])" 2>/dev/null || true)
          if [ "$EVENT" = "schedule" ] && [ "$current" = "$today" ]; then
            echo "::notice::Prognose von heute ist schon publiziert."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        if: steps.cycle.outputs.skip != 'true'
        with:
          version: "0.11.26"
          python-version: "3.13"

      - name: icon-uv installieren
        if: steps.cycle.outputs.skip != 'true'
        run: |
          uv venv .venv
          uv pip install --python .venv "icon-uv[cams] @ git+https://github.com/ofuhrer/icon-uv@${ICON_UV_REF}"
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: ADS-Zugang (CAMS)
        if: steps.cycle.outputs.skip != 'true'
        env:
          ADS_API_KEY: ${{ secrets.ADS_API_KEY }}
        run: |
          if [ -z "$ADS_API_KEY" ]; then echo "::error::Repository-Secret ADS_API_KEY fehlt"; exit 1; fi
          printf 'url: https://ads.atmosphere.copernicus.eu/api\nkey: %s\n' "$ADS_API_KEY" > ~/.cdsapirc

      - name: ICON-CH2 laden
        id: icon
        if: steps.cycle.outputs.skip != 'true'
        env:
          ICON_REF: ${{ steps.cycle.outputs.icon }}
          ENSEMBLE_INPUT: ${{ inputs.ensemble }}
          ENSEMBLE_VAR: ${{ vars.UV_ENSEMBLE }}
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          members="--control"
          if [ "$ENSEMBLE_INPUT" = "true" ] || [ "$ENSEMBLE_VAR" = "true" ]; then members=""; fi
          if icon-uv fetch-icon $members --reference "$ICON_REF" \
               --first-lead 1 --last-lead 96 --output work/icon.nc; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          elif [ "$SCHEDULE" = "$EARLY_CRON" ]; then
            echo "::notice::ICON $ICON_REF noch nicht vollständig – der zweite Lauf versucht es erneut."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            exit 1
          fi

      - name: CAMS laden
        if: steps.icon.outputs.ok == 'true'
        env:
          CAMS_REF: ${{ steps.cycle.outputs.cams }}
        run: |
          icon-uv fetch-cams --reference "$CAMS_REF" \
            --first-lead 12 --last-lead 108 --output work/cams.nc

      - name: UV rechnen und exportieren
        if: steps.icon.outputs.ok == 'true'
        env:
          ISSUED: ${{ steps.cycle.outputs.issued }}
        run: |
          icon-uv run --icon work/icon.nc --cams work/cams.nc --samples 12 --output work/uv.nc
          python build_widget_json.py --grid work/uv.nc --catalog locations.json \
            --issued-at "$ISSUED" --days "$DAYS" --out-dir docs

      - name: Veröffentlichen
        if: steps.icon.outputs.ok == 'true'
        env:
          ICON_REF: ${{ steps.cycle.outputs.icon }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git add docs/daily-uv.json docs/hourly-uv.json
          if git diff --cached --quiet; then echo "Keine Änderungen."; exit 0; fi
          git commit -m "UV-Prognose ${ICON_REF:0:10}"
          git push
